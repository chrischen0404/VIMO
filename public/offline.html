<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F2A43" />
    <title>VIMO 願動｜離線中</title>
    <style>
      :root {
        color: #143756;
        background: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 24% 18%, rgba(201, 236, 255, .76), transparent 28%),
          radial-gradient(circle at 82% 70%, rgba(217, 166, 66, .18), transparent 30%),
          linear-gradient(180deg, #fff 0%, #f3f7fb 100%);
      }
      main {
        width: min(86vw, 440px);
        padding: 34px;
        border-radius: 30px;
        background: rgba(255, 255, 255, .78);
        border: 1px solid rgba(255, 255, 255, .8);
        box-shadow: 0 28px 72px rgba(20, 55, 86, .12);
        backdrop-filter: blur(20px);
        text-align: center;
      }
      img {
        width: 82px;
        height: 82px;
        margin-bottom: 22px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 28px;
        letter-spacing: -.02em;
      }
      p {
        margin: 0;
        color: #5f7794;
        line-height: 1.8;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/vimo-icon.svg" alt="VIMO" />
      <h1>VIMO 願動</h1>
      <p>目前離線中，願望仍在路上。請稍後重新連線。</p>
    </main>
  </body>
</html>
