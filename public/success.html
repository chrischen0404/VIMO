<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F2A43" />
    <title>已收到你的回覆｜VIMO 願動</title>
    <style>
      :root {
        color: #14395a;
        background: #f8fafc;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Noto Sans TC", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 20% 15%, rgba(66, 194, 255, 0.2), transparent 30%),
          radial-gradient(circle at 85% 75%, rgba(53, 213, 188, 0.2), transparent 32%),
          #f8fafc;
      }

      .card {
        width: min(560px, 100%);
        box-sizing: border-box;
        border: 1px solid rgba(255, 255, 255, 0.86);
        border-radius: 38px;
        background: rgba(255, 255, 255, 0.84);
        box-shadow: 0 30px 80px rgba(20, 57, 90, 0.14);
        text-align: center;
        padding: 48px 28px;
        backdrop-filter: blur(24px);
      }

      .mark {
        width: 80px;
        height: 80px;
        margin: 0 auto 28px;
        border-radius: 28px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #ddf2ff, #cff7ee);
        box-shadow: 0 18px 50px rgba(20, 167, 236, 0.22);
      }

      .mark svg {
        width: 42px;
        height: 42px;
      }

      .eyebrow {
        margin: 0;
        color: #087cb8;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      h1 {
        margin: 12px 0 0;
        font-size: clamp(32px, 8vw, 42px);
        line-height: 1.1;
      }

      p {
        margin: 18px auto 0;
        max-width: 430px;
        color: #355879;
        line-height: 1.75;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 54px;
        margin-top: 32px;
        padding: 0 28px;
        border-radius: 999px;
        background: #14395a;
        color: white;
        font-weight: 700;
        text-decoration: none;
        box-shadow: 0 18px 50px rgba(20, 167, 236, 0.22);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none">
          <path d="M13 14L22 34L31 14" stroke="#006DF0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M30 34V20L36 28L42 20V34" stroke="#04B7B0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
          <circle cx="36" cy="28" r="2.5" fill="#F6C94B" />
        </svg>
      </div>
      <p class="eyebrow">Received</p>
      <h1>已收到你的回覆</h1>
      <p>謝謝你加入 VIMO 願動。這份願望會進入熱度池，成為推動下一場活動成局的起點。</p>
      <a href="/">回到首頁</a>
    </main>
  </body>
</html>
